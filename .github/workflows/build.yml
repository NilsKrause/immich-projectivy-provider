name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/^versionName = "\([^"]*\)"/\1/p' gradle/libs.versions.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A release keystore is used when the repo provides one, so published APKs are not
      # debuggable and keep a stable signing identity across builds. Without the secrets
      # the job still works and falls back to the debug build, so merging this does not
      # break CI before the keystore exists.
      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_B64 not set - publishing a debuggable debug build."
          fi

      - name: Build release APK
        if: steps.keystore.outputs.present == 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Build debug APK (no keystore configured)
        if: steps.keystore.outputs.present != 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK to versioned name
        run: |
          APK="immich-provider-${{ steps.version.outputs.version }}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$APK"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          fi
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-provider-apk
          path: |
            immich-provider-${{ steps.version.outputs.version }}.apk
            immich-provider-${{ steps.version.outputs.version }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK="immich-provider-${{ steps.version.outputs.version }}.apk"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="latest"
          fi
          # Idempotent: remove any previous release/tag under this name, then recreate.
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --title "Immich Provider ${{ steps.version.outputs.version }} ($TAG)" \
            --notes-file CHANGELOG.md \
            --target "$GITHUB_SHA"
