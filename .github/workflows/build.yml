name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/^versionName = "\([^"]*\)"/\1/p' gradle/libs.versions.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "immich-provider-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-provider-apk
          path: immich-provider-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK="immich-provider-${{ steps.version.outputs.version }}.apk"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="latest"
          fi
          # Idempotent: remove any previous release/tag under this name, then recreate.
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$APK" \
            --title "Immich Provider ${{ steps.version.outputs.version }} ($TAG)" \
            --notes "Automated build of version ${{ steps.version.outputs.version }} from commit ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"
